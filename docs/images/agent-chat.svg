<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">FreeCodeGo Agent coding workspace</title>
  <desc id="desc">Synthetic, credential-free illustration of a Harness conversation with a code-writing Agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/></filter>
    <style>
      .ui{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#e2e8f0}.muted{fill:#94a3b8}.small{font-size:16px}.body{font-size:20px}.mono{font-family:Consolas,monospace;font-size:17px}.label{font-size:14px;letter-spacing:1.6px;text-transform:uppercase}.bold{font-weight:700}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1230" cy="90" r="220" fill="#38bdf8" opacity=".08"/>
  <rect x="44" y="42" width="1352" height="816" rx="28" fill="#0f172a" stroke="#334155" filter="url(#shadow)"/>
  <rect x="44" y="42" width="274" height="816" rx="28" fill="#111c32"/>
  <rect x="318" y="42" width="1078" height="74" fill="#111827"/>
  <rect x="318" y="116" width="1078" height="742" fill="#f8fafc"/>
  <text x="80" y="96" class="ui bold" font-size="24">FREECODEGO</text>
  <rect x="80" y="130" width="202" height="44" rx="12" fill="url(#accent)"/>
  <text x="102" y="158" class="ui bold" font-size="17" fill="#082f49">+ 新建会话</text>
  <text x="80" y="220" class="ui label muted">SESSIONS</text>
  <rect x="68" y="244" width="226" height="58" rx="12" fill="#1e3a5f"/>
  <circle cx="91" cy="273" r="7" fill="#34d399"/><text x="112" y="280" class="ui small">Implement settings page</text>
  <text x="92" y="338" class="ui small muted">Review API contract</text>
  <text x="92" y="390" class="ui small muted">Graphify architecture</text>
  <text x="80" y="770" class="ui small muted">Engine</text>
  <text x="80" y="800" class="ui bold">Claude · Native</text>
  <text x="80" y="828" class="ui small muted">Session pinned</text>
  <text x="350" y="87" class="ui bold" font-size="22">Implement settings page</text>
  <rect x="1180" y="64" width="174" height="34" rx="17" fill="#dcfce7"/><circle cx="1203" cy="81" r="6" fill="#16a34a"/><text x="1218" y="87" font-size="15" fill="#166534" class="bold">Connected</text>
  <text x="372" y="164" class="muted small">Today · FreeCodeGo Agent</text>
  <rect x="372" y="194" width="702" height="98" rx="18" fill="#e0f2fe"/>
  <text x="398" y="231" class="body" fill="#0f172a">为设置页增加模型分类和语音输入开关，</text>
  <text x="398" y="263" class="body" fill="#0f172a">并保持账号凭据只在 Host 中处理。</text>
  <rect x="372" y="324" width="820" height="298" rx="18" fill="#ffffff" stroke="#dbeafe"/>
  <text x="398" y="365" class="body bold" fill="#0f172a">已完成设置面板改造</text>
  <text x="398" y="402" class="body" fill="#334155">• 新增模型分类和可用性状态</text>
  <text x="398" y="438" class="body" fill="#334155">• API Key 通过 Host credential service 保存</text>
  <text x="398" y="474" class="body" fill="#334155">• 语音输入走 Host 转写桥接</text>
  <rect x="398" y="505" width="746" height="91" rx="10" fill="#0f172a"/>
  <text x="420" y="536" class="mono" fill="#93c5fd">const route = await models.select('claude-sonnet-4-6')</text>
  <text x="420" y="566" class="mono" fill="#86efac">await settings.update({ voiceInputEnabled: true })</text>
  <rect x="1220" y="194" width="142" height="428" rx="18" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="1242" y="232" class="label" fill="#64748b">ENGINE</text>
  <text x="1242" y="273" class="bold" font-size="19" fill="#0f172a">Claude</text>
  <text x="1242" y="302" class="small" fill="#64748b">Native runtime</text>
  <rect x="1242" y="338" width="98" height="28" rx="14" fill="#dbeafe"/><text x="1258" y="357" font-size="13" fill="#1d4ed8">Thinking</text>
  <text x="1242" y="412" class="label" fill="#64748b">MODEL</text>
  <text x="1242" y="445" class="small bold" fill="#0f172a">Claude</text><text x="1242" y="468" class="small" fill="#0f172a">Sonnet 4.6</text>
  <text x="1242" y="548" class="label" fill="#64748b">TOOLS</text>
  <text x="1242" y="578" class="small" fill="#334155">MCP · Skills</text>
  <rect x="372" y="674" width="990" height="106" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="400" y="719" class="small" fill="#64748b">Ask the Agent to inspect, plan, edit, test, and explain.</text>
  <rect x="1194" y="696" width="132" height="48" rx="14" fill="#0f172a"/><text x="1227" y="726" class="ui bold">发送</text>
</svg>
