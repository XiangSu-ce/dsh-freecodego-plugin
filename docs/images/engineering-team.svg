<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">FreeCodeGo engineering team review</title>
  <desc id="desc">Synthetic illustration of a multi-engine collaboration review with findings and approval controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <style>.ui{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#e5e7eb}.muted{fill:#9ca3af}.small{font-size:16px}.body{font-size:19px}.bold{font-weight:700}.label{font-size:13px;letter-spacing:1.4px}</style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="52" y="46" width="1336" height="808" rx="28" fill="#111827" stroke="#4f46e5" stroke-opacity=".45"/>
  <rect x="52" y="46" width="1336" height="78" rx="28" fill="#0f172a"/><text x="88" y="94" class="ui bold" font-size="24">Engineering Team / Council</text><rect x="1138" y="68" width="202" height="36" rx="18" fill="#064e3b"/><circle cx="1162" cy="86" r="6" fill="#34d399"/><text x="1178" y="92" class="ui small" fill="#a7f3d0">Awaiting approval</text>
  <text x="92" y="172" class="ui label muted">OBJECTIVE</text><text x="92" y="210" class="ui bold" font-size="25">Review the release plan for the new model settings flow</text>
  <text x="92" y="250" class="ui muted body">Three isolated engines inspect the same bounded workspace without edit permission.</text>
  <rect x="92" y="294" width="390" height="310" rx="18" fill="#172554" stroke="#3730a3"/><circle cx="130" cy="338" r="13" fill="#38bdf8"/><text x="160" y="345" class="ui bold" font-size="21">DeepSeek</text><text x="130" y="386" class="ui small" fill="#bfdbfe">Architecture perspective</text><rect x="130" y="416" width="308" height="8" rx="4" fill="#1e3a8a"/><rect x="130" y="416" width="272" height="8" rx="4" fill="#38bdf8"/><text x="130" y="458" class="ui body">✓ Scope clarified</text><text x="130" y="494" class="ui body">✓ API boundary reviewed</text><text x="130" y="530" class="ui body">! Add rollback note</text><rect x="130" y="556" width="92" height="28" rx="14" fill="#064e3b"/><text x="150" y="575" class="ui small" fill="#a7f3d0">complete</text>
  <rect x="525" y="294" width="390" height="310" rx="18" fill="#241b4b" stroke="#5b21b6"/><circle cx="563" cy="338" r="13" fill="#a78bfa"/><text x="593" y="345" class="ui bold" font-size="21">Codex</text><text x="563" y="386" class="ui small" fill="#ddd6fe">Implementation perspective</text><rect x="563" y="416" width="308" height="8" rx="4" fill="#3b0764"/><rect x="563" y="416" width="240" height="8" rx="4" fill="#a78bfa"/><text x="563" y="458" class="ui body">✓ Test matrix proposed</text><text x="563" y="494" class="ui body">✓ Native runtime checked</text><text x="563" y="530" class="ui body">! Verify Windows path</text><rect x="563" y="556" width="92" height="28" rx="14" fill="#78350f"/><text x="583" y="575" class="ui small" fill="#fde68a">warning</text>
  <rect x="958" y="294" width="390" height="310" rx="18" fill="#422006" stroke="#92400e"/><circle cx="996" cy="338" r="13" fill="#fbbf24"/><text x="1026" y="345" class="ui bold" font-size="21">Claude</text><text x="996" y="386" class="ui small" fill="#fde68a">Security and recovery</text><rect x="996" y="416" width="308" height="8" rx="4" fill="#451a03"/><rect x="996" y="416" width="286" height="8" rx="4" fill="#fbbf24"/><text x="996" y="458" class="ui body">✓ Credential boundary clear</text><text x="996" y="494" class="ui body">✓ Recovery behavior reviewed</text><text x="996" y="530" class="ui body">✓ No blocker found</text><rect x="996" y="556" width="92" height="28" rx="14" fill="#064e3b"/><text x="1016" y="575" class="ui small" fill="#a7f3d0">complete</text>
  <rect x="92" y="646" width="1256" height="150" rx="18" fill="#0b1220" stroke="#334155"/><text x="124" y="686" class="ui label muted">CONSENSUS</text><text x="124" y="724" class="ui body">Recommendation: approve after adding the Windows path test and rollback note.</text><text x="124" y="758" class="ui small muted">Report, plan digest, workspace fingerprint and verification stages are persisted in the parent Session.</text><rect x="1084" y="708" width="114" height="46" rx="13" fill="url(#cyan)"/><text x="1110" y="737" class="ui bold" fill="#0f172a">批准实现</text><rect x="1212" y="708" width="108" height="46" rx="13" fill="#334155"/><text x="1238" y="737" class="ui bold">拒绝</text>
</svg>
