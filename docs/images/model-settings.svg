    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity=".16"/></filter>
    <style>.ui{font-family:Segoe UI,Microsoft YaHei,sans-serif}.muted{fill:#64748b}.dark{fill:#0f172a}.small{font-size:16px}.body{font-size:20px}.bold{font-weight:700}.label{font-size:14px;letter-spacing:1.5px}</style>
  </defs>
